<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cubeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#e879f9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#0a0a0f"/>
  
  <!-- 3D Cube - Unity style -->
  <g filter="url(#glow)">
    <!-- Top face -->
    <polygon points="32,12 52,24 32,36 12,24" fill="#22d3ee" opacity="1"/>
    <!-- Left face -->
    <polygon points="12,24 32,36 32,52 12,40" fill="#06b6d4" opacity="0.8"/>
    <!-- Right face -->
    <polygon points="52,24 52,40 32,52 32,36" fill="#e879f9" opacity="0.7"/>
  </g>
</svg>

